<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b17"/>
      <stop offset="1" stop-color="#1a1333"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- orbs di belakang kaca -->
  <circle cx="230" cy="90" r="110" fill="#7c3aed" opacity="0.75" filter="url(#blur)"/>
  <circle cx="620" cy="260" r="100" fill="#2563eb" opacity="0.6" filter="url(#blur)"/>
  <circle cx="980" cy="70" r="120" fill="#db2777" opacity="0.55" filter="url(#blur)"/>

  <!-- panel kaca -->
  <rect x="60" y="40" width="1080" height="220" rx="32" fill="url(#glass)"/>
  <rect x="60.5" y="40.5" width="1079" height="219" rx="31.5" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M92 41 H1108" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>

  <text x="110" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-2">Oby</text>
  <text x="114" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#e9e5ff" fill-opacity="0.85">Full Stack Developer</text>

  <!-- chip kaca -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#f3f0ff">
    <rect x="114" y="212" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="162" y="232" text-anchor="middle">MLBB</text>
    <rect x="220" y="212" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="268" y="232" text-anchor="middle">Hoyoverse</text>
    <rect x="326" y="212" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="374" y="232" text-anchor="middle">Root</text>
    <rect x="432" y="212" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="487" y="232" text-anchor="middle">Infinity X</text>
  </g>

  <!-- ikon lucide: gamepad-2 besar di kanan -->
  <g transform="translate(860 80) scale(5.5)" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" x2="10" y1="11" y2="11"/>
    <line x1="8" x2="8" y1="9" y2="13"/>
    <line x1="15" x2="15.01" y1="12" y2="12"/>
    <line x1="18" x2="18.01" y1="10" y2="10"/>
    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
  </g>
</svg>
